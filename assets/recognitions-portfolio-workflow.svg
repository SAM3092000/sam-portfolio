<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="760" viewBox="0 0 1320 760" role="img" aria-labelledby="title description">
  <title id="title">Employee recognition workflow</title>
  <desc id="description">An anonymized diagram of the working, AI-assisted dashboard. A nominator chooses a recognition size, enters recipients, describes the contribution and behaviors, and picks a month. Validated records save in that browser for search and printing. Shared enterprise integrations are planned.</desc>
  <defs>
    <linearGradient id="header" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#2146c6"/>
      <stop offset="1" stop-color="#5142d8"/>
    </linearGradient>
  </defs>
  <style>
    text {font-family:"DM Sans",Arial,Helvetica,sans-serif;fill:#19273c}
    .white {fill:#fff}
    .eyebrow {font-size:12px;font-weight:700;letter-spacing:1.2px}
    .title {font-weight:700;font-size:40px}
    .subtitle {font-size:19px;fill:#edf2ff}
    .head {font-size:22px;font-weight:700}
    .body {font-size:17px;fill:#34465b}
    .note {font-size:15px;fill:#324aa1}
    .step {font-size:16px;font-weight:700;fill:#2546bc;text-anchor:middle}
    .panel {fill:#fff;stroke:#d5ddea;stroke-width:1.4}
    .footer {font-size:16px;fill:#eef3ff}
  </style>
  <rect width="1320" height="760" fill="#f6f8fb"/>
  <rect x="36" y="28" width="1248" height="136" rx="19" fill="url(#header)"/>
  <text class="eyebrow white" x="66" y="59">WORKING RECOGNITIONS DASHBOARD</text>
  <text class="title white" x="64" y="106">Employee recognition workflow</text>
  <text class="subtitle" x="66" y="140">Four steps from choosing recipients to saving a nomination in the browser.</text>

  <g transform="translate(36 199)">
    <rect class="panel" width="294" height="218" rx="15"/>
    <circle cx="34" cy="38" r="18" fill="#eaf0ff"/>
    <text class="step" x="34" y="44">1</text>
    <text class="head" x="62" y="45">Recognition size</text>
    <text class="body" x="22" y="96">Choose one person, two</text>
    <text class="body" x="22" y="123">people, or a team.</text>
    <text class="note" x="22" y="183">Only the selected path appears.</text>
  </g>
  <g transform="translate(354 199)">
    <rect class="panel" width="294" height="218" rx="15"/>
    <circle cx="34" cy="38" r="18" fill="#eaf0ff"/>
    <text class="step" x="34" y="44">2</text>
    <text class="head" x="62" y="45">Recipients</text>
    <text class="body" x="22" y="96">Enter individual names</text>
    <text class="body" x="22" y="123">or the team name.</text>
    <text class="note" x="22" y="174">Changing paths clears hidden</text>
    <text class="note" x="22" y="195">recipient names.</text>
  </g>
  <g transform="translate(672 199)">
    <rect class="panel" width="294" height="218" rx="15"/>
    <circle cx="34" cy="38" r="18" fill="#eaf0ff"/>
    <text class="step" x="34" y="44">3</text>
    <text class="head" x="62" y="45">Contribution</text>
    <text class="body" x="22" y="96">Describe the work, its impact,</text>
    <text class="body" x="22" y="123">and the behaviors it reflects.</text>
    <text class="note" x="22" y="174">Required fields and text limits</text>
    <text class="note" x="22" y="195">are checked before continuing.</text>
  </g>
  <g transform="translate(990 199)">
    <rect class="panel" width="294" height="218" rx="15"/>
    <circle cx="34" cy="38" r="18" fill="#eaf0ff"/>
    <text class="step" x="34" y="44">4</text>
    <text class="head" x="62" y="45">Recognition month</text>
    <text class="body" x="22" y="96">Choose a fiscal month</text>
    <text class="body" x="22" y="123">and review the nomination.</text>
    <text class="note" x="22" y="174">Earlier answers are retained</text>
    <text class="note" x="22" y="195">when navigating back.</text>
  </g>
  <g fill="none" stroke="#71829b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M333 309h17m-6 -6 6 6-6 6"/>
    <path d="M651 309h17m-6 -6 6 6-6 6"/>
    <path d="M969 309h17m-6 -6 6 6-6 6"/>
  </g>

  <rect class="panel" x="36" y="448" width="650" height="189" rx="15"/>
  <text class="head" x="60" y="490">After a successful local save</text>
  <text class="body" x="60" y="530">The nomination appears in this browser’s searchable history.</text>
  <text class="body" x="60" y="559">Open it again to read or print the answers.</text>
  <text class="note" x="60" y="603">A storage error preserves the entered answers and displays a message.</text>

  <rect x="708" y="448" width="576" height="189" rx="15" fill="#ebf1ff" stroke="#c7d5ef" stroke-width="1.4"/>
  <text class="head" x="732" y="490">Participation reporting</text>
  <text class="body" x="732" y="530">A nomination for two people still creates one record.</text>
  <text class="body" x="732" y="559">The dashboard reports local record volume.</text>
  <text class="note" x="732" y="603">Official counts depend on agreed participation and rollover rules.</text>

  <rect x="36" y="663" width="1248" height="68" rx="14" fill="#19273c"/>
  <text class="footer" x="60" y="691">Anonymized workflow illustration. Shared enterprise integrations are planned.</text>
  <text class="footer" x="60" y="715">React · TypeScript · Vite · Browser-local storage · Copilot-assisted implementation</text>
</svg>
